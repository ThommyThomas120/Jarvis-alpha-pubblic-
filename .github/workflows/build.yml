      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila
        run: gradle -p proj assembleRelease --stacktrace --no-daemon

      - name: Prepara APK
        run: cp proj/app/build/outputs/apk/release/*.apk JarvisBeta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: JarvisBeta.apk

      - name: Pubblica nella Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "Jarvis Beta (build ${{ github.run_number }})"
          body: "Scarica JarvisBeta.apk qui sotto e aprilo dal telefono Android per installarlo."
          artifacts: JarvisBeta.apk
          makeLatest: true
