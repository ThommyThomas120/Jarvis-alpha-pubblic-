      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila
        run: gradle -p proj assembleRelease --stacktrace --no-daemon

      - name: Prepara APK
        run: cp proj/app/build/outputs/apk/release/*.apk JarvisAlpha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: JarvisAlpha.apk

      - name: Pubblica nella Release
        uses: ncipollo/release-action@v1
        with:
          tag: ultima
          name: Jarvis Alpha
          body: "Scarica JarvisAlpha.apk qui sotto e aprilo dal telefono Android per installarlo."
          artifacts: JarvisAlpha.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
